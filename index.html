<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Into One - 3D Intro Effect</title>
  <!-- GSAP CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f4f4;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 3D 씬 컨테이너 */
    .scene {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
      position: relative;
    }

    /* 3D 카드 스택 래퍼 */
    .stack {
      position: relative;
      width: 340px;
      height: 340px;
      transform-style: preserve-3d;
      /* 초기 원근 각도 */
      transform: rotateY(-32deg) rotateX(6deg);
    }

    /* 개별 이미지 레이어 (5개) */
    .card {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      border-radius: 50%; /* 원형에서 시작 */
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      opacity: 0;
      will-change: transform, width, height, border-radius, filter;
      filter: grayscale(100%) contrast(1.15);
    }

    /* 동일 폴더 내 001.jpeg ~ 005.jpeg 이미지 지정 */
    .card-1 {
      /* 메인 전면 이미지 (화면 전체로 확장될 레이어) */
      background-image: url('./001.jpeg');
      z-index: 5;
    }
    .card-2 {
      background-image: url('./002.jpeg');
      z-index: 4;
    }
    .card-3 {
      background-image: url('./003.jpeg');
      z-index: 3;
    }
    .card-4 {
      background-image: url('./004.jpeg');
      z-index: 2;
    }
    .card-5 {
      background-image: url('./005.jpeg');
      z-index: 1;
    }

    /* 좌측 상단 텍스트 오버레이 */
    .content-overlay {
      position: fixed;
      top: 10%;
      left: 5%;
      z-index: 20;
      color: #ffffff;
      max-width: 280px;
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
      text-shadow: 0 2px 15px rgba(0, 0, 0, 0.5);
    }

    .content-overlay h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    .content-overlay .subtitle {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 16px;
      font-weight: 400;
    }

    .content-overlay .description {
      font-size: 0.72rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.9);
      font-weight: 400;
    }

    /* 다시 보기 버튼 (우측 하단) */
    .replay-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 30;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      font-size: 0.75rem;
      border-radius: 20px;
      cursor: pointer;
      opacity: 0;
      transition: background 0.3s;
    }

    .replay-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="stack">
      <div class="card card-5"></div>
      <div class="card card-4"></div>
      <div class="card card-3"></div>
      <div class="card card-2"></div>
      <div class="card card-1"></div>
    </div>
  </div>

  <div class="content-overlay">
    <h1>Five Into One</h1>
    <div class="subtitle">with Ousmane</div>
    <p class="description">
      An expressive opening scene featuring five visual elements transitioning into one cohesive composition. The sequence balances depth, perspective, and rhythm, drawing natural inspiration from fashion, motion, and visual arts.
    </p>
  </div>

  <button class="replay-btn" id="replayBtn">Replay Animation</button>

  <script>
    const cards = [
      document.querySelector('.card-1'),
      document.querySelector('.card-2'),
      document.querySelector('.card-3'),
      document.querySelector('.card-4'),
      document.querySelector('.card-5')
    ];

    const tl = gsap.timeline({ paused: true });

    function initAnimation() {
      tl.clear();

      // 1. 초기 상태 세팅 (작은 원형 상태에서 대각선/깊이 방향으로 배치)
      gsap.set('.stack', {
        width: 340,
        height: 340,
        rotationY: -32,
        rotationX: 6
      });

      gsap.set('.content-overlay', { opacity: 0, y: 15 });
      gsap.set('#replayBtn', { opacity: 0 });

      cards.forEach((card, i) => {
        gsap.set(card, {
          opacity: 0,
          scale: 0.15,
          borderRadius: '50%',
          x: -i * 65,
          z: -i * 110,
          filter: 'grayscale(100%) contrast(1.15)'
        });
      });

      // 2. 원형 레이어가 순차적으로 팝업되며 등장 (0.0s ~ 0.9s)
      tl.to(cards, {
        opacity: 1,
        scale: (i) => 1 - i * 0.14,
        x: (i) => -i * 45,
        z: (i) => -i * 90,
        duration: 0.85,
        stagger: 0.08,
        ease: 'expo.out'
      })

      // 3. 원형에서 사각형 카드로 변형 및 3D 정렬 (0.9s ~ 1.7s)
      .to(cards, {
        borderRadius: '0%',
        scale: 1,
        x: (i) => i * 38,
        z: (i) => -i * 85,
        duration: 0.85,
        ease: 'power3.inOut'
      }, '-=0.15')

      // 4. 5개의 카드가 첫 번째 카드로 하나로 합쳐짐 (Five Into One) (1.7s ~ 2.4s)
      .to(cards, {
        x: 0,
        z: 0,
        duration: 0.7,
        ease: 'power4.inOut'
      })
      .to(cards.slice(1), {
        opacity: 0,
        duration: 0.3
      }, '-=0.35')

      // 5. 정면으로 회전하면서 전체 화면(100vw, 100vh)으로 확장 및 컬러 복원 (2.4s ~ 3.5s)
      .to('.stack', {
        rotationY: 0,
        rotationX: 0,
        width: '100vw',
        height: '100vh',
        duration: 1.15,
        ease: 'expo.inOut'
      }, '-=0.25')
      .to('.card-1', {
        filter: 'grayscale(0%) contrast(1.05)',
        boxShadow: '0 0 0 rgba(0,0,0,0)',
        duration: 1.15,
        ease: 'power2.inOut'
      }, '<')

      // 6. 좌측 상단 타이틀 및 설명 텍스트 페이드인 (3.5s ~ 4.2s)
      .to('.content-overlay', {
        opacity: 1,
        y: 0,
        duration: 0.8,
        ease: 'power3.out'
      }, '-=0.3')
      .to('#replayBtn', {
        opacity: 1,
        duration: 0.5
      }, '-=0.4');

      tl.play(0);
    }

    window.addEventListener('load', initAnimation);
    document.getElementById('replayBtn').addEventListener('click', initAnimation);
  </script>
</body>
</html>
